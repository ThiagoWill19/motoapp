spring.application.name=motoapp

# Configuração do banco de dados
spring.datasource.url=jdbc:mysql://localhost:3306/db_motoapp?useSSL=false&serverTimezone=America/Sao_Paulo&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuração do JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# Opcional: Define o charset da conexão
spring.datasource.hikari.connection-init-sql=SET NAMES utf8mb4
