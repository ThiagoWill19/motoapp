<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MotoApp - Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    
    <style>
        :root {
            --bs-black: #121212;
            --bs-green: #00C853;
            --bs-green-hover: #00b048;
        }

        body {
            background-color: #ffffff;
            color: var(--bs-black);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-card {
            border: none;
            border-radius: 1rem;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            background-color: #ffffff;
            padding: 2.5rem;
            width: 100%;
            max-width: 420px;
        }

        .logo-moto {
            color: var(--bs-black);
            font-weight: 800;
            letter-spacing: -0.5px;
        }

        .logo-app {
            color: var(--bs-green);
            font-weight: 800;
            letter-spacing: -0.5px;
        }

        .slogan {
            font-size: 0.9rem;
            color: #6c757d;
            margin-bottom: 2rem;
        }

        .form-control:focus {
            border-color: var(--bs-green);
            box-shadow: 0 0 0 0.25rem rgba(0, 200, 83, 0.15);
        }

        .btn-custom-green {
            background-color: var(--bs-green);
            color: #ffffff;
            font-weight: 600;
            border: none;
            transition: background-color 0.2s ease-in-out;
        }

        .btn-custom-green:hover {
            background-color: var(--bs-green-hover);
            color: #ffffff;
        }

        .form-label {
            font-weight: 500;
            font-size: 0.9rem;
        }

        .password-toggle {
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="card login-card">
        <div class="text-center">
            <h1 class="h2 mb-1">
                <span class="logo-moto">Moto</span><span class="logo-app">App</span>
            </h1>
            <p class="slogan">Seu diario de moto online</p>
        </div>

        <div th:if="${param.error}" class="alert alert-danger alert-dismissible fade show py-2 mb-3 text-center" role="alert" style="font-size: 0.85rem;">
            E-mail ou senha invalidos.
            <button type="button" class="btn-close py-2" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>

        <div th:if="${param.logout}" class="alert alert-success alert-dismissible fade show py-2 mb-3 text-center" role="alert" style="font-size: 0.85rem;">
            Voce saiu com sucesso.
            <button type="button" class="btn-close py-2" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>

        <div th:if="${param.success}" class="alert alert-success alert-dismissible fade show py-2 mb-3 text-center" role="alert" style="font-size: 0.85rem;">
            Conta criada com sucesso! Faca login para continuar.
            <button type="button" class="btn-close py-2" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>

        <div th:if="${param.registrationError}" class="alert alert-danger alert-dismissible fade show py-2 mb-3 text-center" role="alert" style="font-size: 0.85rem;">
            Nao foi possivel concluir o cadastro. Verifique os dados e tente novamente.
            <button type="button" class="btn-close py-2" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>

        <form th:action="@{/login}" method="post">
            <div class="mb-3">
                <label for="username" class="form-label">E-mail</label>
                <div class="input-group">
                    <span class="input-group-text bg-light border-end-0"><i class="bi bi-envelope text-muted"></i></span>
                    <input type="email" class="form-control border-start-0 ps-0" id="username" name="username" placeholder="seu@email.com" required autofocus>
                </div>
            </div>

            <div class="mb-4">
                <div class="d-flex justify-content-between align-items-center">
                    <label for="password" class="form-label">Senha</label>
                    <a href="#" class="text-decoration-none text-muted" style="font-size: 0.8rem;">Esqueceu a senha?</a>
                </div>
                <div class="input-group">
                    <span class="input-group-text bg-light border-end-0"><i class="bi bi-lock text-muted"></i></span>
                    <input type="password" class="form-control border-start-0 border-end-0 ps-0" id="password" name="password" placeholder="••••••••" required>
                    <span class="input-group-text bg-light border-start-0 password-toggle" id="togglePassword">
                        <i class="bi bi-eye text-muted" id="toggleIcon"></i>
                    </span>
                </div>
            </div>

            <div class="d-grid mb-3">
                <button type="submit" class="btn btn-custom-green py-2">Entrar</button>
            </div>
            
            <div class="text-center" style="font-size: 0.85rem;">
                <span class="text-muted">Ainda nao tem uma conta?</span> <a th:href="@{/create-account}" class="text-decoration-none fw-semibold" style="color: var(--bs-green);">Cadastre-se</a>
            </div>
        </form>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const togglePassword = document.getElementById('togglePassword');
        const passwordInput = document.getElementById('password');
        const toggleIcon = document.getElementById('toggleIcon');

        togglePassword.addEventListener('click', function () {
            const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
            passwordInput.setAttribute('type', type);
            toggleIcon.classList.toggle('bi-eye');
            toggleIcon.classList.toggle('bi-eye-slash');
        });
    </script>
</body>
</html>
