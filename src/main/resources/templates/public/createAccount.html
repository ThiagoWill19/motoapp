<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MotoApp - Criar Conta</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <style>
        :root {
            --bs-black: #121212;
            --bs-green: #00C853;
            --bs-green-hover: #00b048;
        }

        body {
            background-color: #ffffff;
            color: var(--bs-black);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem 1rem;
        }

        .register-card {
            border: none;
            border-radius: 1rem;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            background-color: #ffffff;
            padding: 2.5rem;
            width: 100%;
            max-width: 520px;
        }

        .logo-moto {
            color: var(--bs-black);
            font-weight: 800;
            letter-spacing: -0.5px;
        }

        .logo-app {
            color: var(--bs-green);
            font-weight: 800;
            letter-spacing: -0.5px;
        }

        .slogan {
            font-size: 0.9rem;
            color: #6c757d;
            margin-bottom: 0.5rem;
        }

        .intro-text {
            font-size: 0.92rem;
            color: #6c757d;
            margin-bottom: 2rem;
        }

        .form-control:focus,
        .form-check-input:focus {
            border-color: var(--bs-green);
            box-shadow: 0 0 0 0.25rem rgba(0, 200, 83, 0.15);
        }

        .btn-custom-green {
            background-color: var(--bs-green);
            color: #ffffff;
            font-weight: 600;
            border: none;
            transition: background-color 0.2s ease-in-out;
        }

        .btn-custom-green:hover {
            background-color: var(--bs-green-hover);
            color: #ffffff;
        }

        .form-label {
            font-weight: 500;
            font-size: 0.9rem;
        }

        .password-toggle {
            cursor: pointer;
        }

        .validation-message {
            display: none;
            font-size: 0.82rem;
            color: #dc3545;
            margin-top: 0.35rem;
        }

        .validation-message.active {
            display: block;
        }
    </style>
</head>
<body>
    <div class="card register-card">
        <div class="text-center">
            <h1 class="h2 mb-1">
                <span class="logo-moto">Moto</span><span class="logo-app">App</span>
            </h1>
            <p class="slogan">Seu diário de moto online</p>
            <p class="intro-text">Crie sua conta para acompanhar revisões, serviços e o histórico da sua moto em um só lugar.</p>
        </div>

        <form th:action="@{/create-account}" th:object="${createUserDto}" method="post" novalidate>
            <div class="row g-3">
                <div class="col-12">
                    <label for="name" class="form-label">Nome completo</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light border-end-0"><i class="bi bi-person text-muted"></i></span>
                        <input type="text" class="form-control border-start-0 ps-0" id="name" th:field="*{name}" placeholder="Seu nome completo" required autofocus>
                    </div>
                </div>

                <div class="col-12">
                    <label for="email" class="form-label">E-mail</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light border-end-0"><i class="bi bi-envelope text-muted"></i></span>
                        <input type="email" class="form-control border-start-0 ps-0" id="email" th:field="*{email}" placeholder="seu@email.com" required>
                    </div>
                </div>

                <div class="col-md-6">
                    <label for="password" class="form-label">Senha</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light border-end-0"><i class="bi bi-lock text-muted"></i></span>
                        <input type="password" class="form-control border-start-0 border-end-0 ps-0" id="password" th:field="*{password}" placeholder="Mínimo de 8 caracteres e 1 especial" minlength="8" pattern="^(?=.*[!@#$%^&*()_+\-=\[\]{};':&quot;\\|,.&lt;&gt;\/?]).{8,}$" title="A senha deve ter no minimo 8 caracteres e pelo menos 1 caractere especial." required>
                        <span class="input-group-text bg-light border-start-0 password-toggle" data-target="password" data-icon="toggleIconPassword">
                            <i class="bi bi-eye text-muted" id="toggleIconPassword"></i>
                        </span>
                    </div>
                    <div class="form-text">Use no mínimo 8 caracteres e pelo menos 1 caractere especial.</div>
                    <div id="passwordError" class="validation-message" aria-live="polite"></div>
                </div>

                <div class="col-md-6">
                    <label for="confirmPassword" class="form-label">Confirmar senha</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light border-end-0"><i class="bi bi-shield-lock text-muted"></i></span>
                        <input type="password" class="form-control border-start-0 border-end-0 ps-0" id="confirmPassword" th:field="*{confirmPassword}" placeholder="Repita sua senha" required>
                        <span class="input-group-text bg-light border-start-0 password-toggle" data-target="confirmPassword" data-icon="toggleIconConfirmPassword">
                            <i class="bi bi-eye text-muted" id="toggleIconConfirmPassword"></i>
                        </span>
                    </div>
                    <div id="confirmPasswordError" class="validation-message" aria-live="polite"></div>
                </div>
            </div>

            <div class="form-check mt-4 mb-4">
                <input class="form-check-input" type="checkbox" value="accepted" id="terms" name="terms" required>
                <label class="form-check-label text-muted" for="terms" style="font-size: 0.88rem;">
                    Concordo com os termos de uso e com o armazenamento dos meus dados para acesso a plataforma.
                </label>
            </div>

            <div class="d-grid mb-3">
                <button type="submit" class="btn btn-custom-green py-2">Criar conta</button>
            </div>

            <div class="text-center" style="font-size: 0.85rem;">
                <span class="text-muted">Ja tem uma conta?</span> <a th:href="@{/login}" class="text-decoration-none fw-semibold" style="color: var(--bs-green);">Entrar</a>
            </div>
        </form>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const form = document.querySelector('form');
        const passwordInput = document.getElementById('password');
        const confirmPasswordInput = document.getElementById('confirmPassword');
        const passwordError = document.getElementById('passwordError');
        const confirmPasswordError = document.getElementById('confirmPasswordError');

        function setFieldError(input, messageElement, message) {
            input.classList.add('is-invalid');
            messageElement.textContent = message;
            messageElement.classList.add('active');
        }

        function clearFieldError(input, messageElement) {
            input.classList.remove('is-invalid');
            messageElement.textContent = '';
            messageElement.classList.remove('active');
        }

        function validatePasswordFields() {
            const specialCharacterPattern = /[!@#$%^&*()_+\-=\[\]{};':"\\|,.<>\/?]/;
            const hasMinLength = passwordInput.value.length >= 8;
            const hasSpecialCharacter = specialCharacterPattern.test(passwordInput.value);

            if (!hasMinLength || !hasSpecialCharacter) {
                const message = 'A senha deve ter no minimo 8 caracteres e pelo menos 1 caractere especial.';
                passwordInput.setCustomValidity(message);
                setFieldError(passwordInput, passwordError, message);
            } else {
                passwordInput.setCustomValidity('');
                clearFieldError(passwordInput, passwordError);
            }

            if (confirmPasswordInput.value && passwordInput.value !== confirmPasswordInput.value) {
                const message = 'As senhas nao coincidem.';
                confirmPasswordInput.setCustomValidity(message);
                setFieldError(confirmPasswordInput, confirmPasswordError, message);
            } else {
                confirmPasswordInput.setCustomValidity('');
                clearFieldError(confirmPasswordInput, confirmPasswordError);
            }
        }

        passwordInput.addEventListener('input', validatePasswordFields);
        confirmPasswordInput.addEventListener('input', validatePasswordFields);

        form.addEventListener('submit', function (event) {
            validatePasswordFields();

            if (!form.checkValidity()) {
                event.preventDefault();
                event.stopPropagation();
            }
        });

        document.querySelectorAll('.password-toggle').forEach(function (toggle) {
            toggle.addEventListener('click', function () {
                const targetId = toggle.getAttribute('data-target');
                const iconId = toggle.getAttribute('data-icon');
                const input = document.getElementById(targetId);
                const icon = document.getElementById(iconId);
                const type = input.getAttribute('type') === 'password' ? 'text' : 'password';

                input.setAttribute('type', type);
                icon.classList.toggle('bi-eye');
                icon.classList.toggle('bi-eye-slash');
            });
        });
    </script>
</body>
</html>
